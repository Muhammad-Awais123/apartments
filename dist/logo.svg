<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C877" />
      <stop offset="50%" stop-color="#C8A24A" />
      <stop offset="100%" stop-color="#9E7B26" />
    </linearGradient>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12172B" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>
  </defs>

  <!-- Luxury Monogram Emblem -->
  <g transform="translate(15, 10)">
    <!-- Hexagonal Diamond Shield -->
    <polygon points="50,0 100,28 100,72 50,100 0,72 0,28" fill="url(#inkGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <polygon points="50,7 92,31 92,69 50,93 8,69 8,31" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
    
    <!-- Stylized Architectural 'Z' -->
    <path d="M 28 32 L 72 32 L 34 68 L 72 68" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="50" r="3" fill="#E6C877" />
  </g>

  <!-- Typography: ZAK RESIDENCE -->
  <text x="135" y="58" font-family="'Quattrocento Sans', 'Cinzel', serif" font-size="36" font-weight="700" letter-spacing="6" fill="url(#goldGrad)">ZAK</text>
  <text x="250" y="58" font-family="'Quattrocento Sans', 'Cinzel', serif" font-size="36" font-weight="400" letter-spacing="6" fill="#0B0D12">RESIDENCE</text>
  
  <!-- Subtitle Tagline -->
  <text x="138" y="82" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="600" letter-spacing="4.5" fill="#C8A24A">LIVE · STAY · FEEL HOME</text>
  
  <!-- Decorative Accent Line -->
  <line x1="138" y1="92" x2="420" y2="92" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />
</svg>
